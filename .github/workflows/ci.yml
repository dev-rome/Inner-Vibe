name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Placeholders. NEXT_PUBLIC_* values are inlined into the client bundle
      # at build time, so the build wants them present, but this job only
      # compiles and never reaches Supabase. Real credentials would add risk
      # for no benefit. DATABASE_URL is not needed: the only module that reads
      # it at import time is the seed script, which no route imports.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The browser is ~100MB. Cached on the Playwright version, so it is
      # fetched once per upgrade rather than once per run.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --only-shell matches the headless config in vitest.config.mts, and
      # skips the full browser. --with-deps installs the system libraries a
      # bare runner does not have; it is a no-op once they are present.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # Unit tests in jsdom plus every story in a real browser, with axe
      # asserting on each one.
      - name: Test
        run: npm run test:run

      - name: Build app
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
